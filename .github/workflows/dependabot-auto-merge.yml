name: Dependabot Auto-Merge

on:
  pull_request:
    branches: [master, main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-automerge-${{ github.event.pull_request.number }}

jobs:
  # Dependabot opens a PR → enable GitHub native auto-merge for safe bumps.
  # The old wait-on-check-action design deadlocked: the job polled for all
  # checks to complete, but the skipped `copilot-review` check-run never
  # settles in its eyes, so every dependabot PR hung to the 6h job timeout
  # and came out red. `gh pr merge --auto` delegates the waiting to GitHub:
  # the PR merges itself once the required CI checks pass — no polling job.
  dependabot-pr:
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🟢 Enable auto-merge for patch/minor bumps
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge --auto --squash --delete-branch "$PR_URL"
          echo "✅ Auto-merge enabled for ${{ steps.metadata.outputs.update-type }} — merges when required checks pass"

      - name: 🟡 Label major bumps for manual review
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr edit "$PR_URL" --add-label "major-bump"
          gh pr comment "$PR_URL" --body "⚠️ **Major version bump** (\`${{ steps.metadata.outputs.update-type }}\`) — manual review required before merging."
